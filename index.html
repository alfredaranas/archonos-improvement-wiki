<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ArchonOS Improvement Wiki</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Living wiki of AI agent improvement videos — curated for ArchonOS.">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧠</text></svg>">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-dark-mode/dist/docsify-dark-mode.min.css">
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'ArchonOS Improvement Wiki',
      repo: 'https://github.com/alfredaranas/archonos-improvement-wiki',
      loadSidebar: true,
      maxLevel: 3,
      subMaxLevel: 2,
      auto2top: true,
      search: 'auto',
      darkMode: {
        dark: { background: '#1a1a2e', foreground: '#eee' },
        light: { background: '#fff', foreground: '#333' }
      },
      plugins: [
        function(hook, vm) {
          hook.beforeEach(function(content) {
            const date = new Date().toISOString().split('T')[0];
            return content;
          });
        }
      ]
    };
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-dark-mode/dist/docsify-dark-mode.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
</body>
</html>
