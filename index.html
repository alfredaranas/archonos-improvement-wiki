<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ArchonOS Improvement Wiki</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Living wiki of AI agent improvement videos — curated for ArchonOS.">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%22 0 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧠</text></svg>">
  <link rel="stylesheet" href="vendor/fonts/jetbrains-mono.css">
  <style>
    /* ============================================================
       ARCHONOS IMPROVEMENT WIKI — CYBERPUNK THEME (v3.0)
       Bloomberg-terminal dashboard layout · Original cyberpunk DNA
       Background: #0a0e14 | Green: #00ff41 | Blue: #00a3ff
       Amber: #ffb86c     | Red: #ff5555  | Purple: #c792ea
       ============================================================ */

    :root {
      --bg-primary: #0a0e14;
      --bg-secondary: #0d1117;
      --bg-tertiary: #161b22;
      --bg-elevated: #1c2333;
      --border-color: #1e2a3a;
      --border-light: #2d3a4a;
      --text-primary: #e6edf3;
      --text-secondary: #8b949e;
      --text-muted: #6272a4;
      --accent-green: #00ff41;
      --accent-green-dim: rgba(0, 255, 65, 0.10);
      --accent-blue: #00a3ff;
      --accent-blue-dim: rgba(0, 163, 255, 0.10);
      --accent-amber: #ffb86c;
      --accent-amber-dim: rgba(255, 184, 108, 0.10);
      --accent-red: #ff5555;
      --accent-red-dim: rgba(255, 85, 85, 0.10);
      --accent-purple: #c792ea;
      --accent-purple-dim: rgba(199, 146, 234, 0.10);
      --font-mono: 'JetBrains Mono', monospace;
      --sidebar-width: 280px;
    }

    /* === BASE === */
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* Hide docsify's default GitHub corner — replaced by our topbar button */
    .github-corner, .github-banner { display: none !important; }

    /* === SCROLLBAR === */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg-secondary); }
    ::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

    a { color: var(--accent-blue); text-decoration: none; }
    a:hover { color: var(--accent-green); }

    /* === SIDEBAR (refined) === */
    .sidebar {
      background: var(--bg-secondary);
      border-right: 1px solid var(--border-color);
      width: var(--sidebar-width);
      overflow-y: auto;
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
    }

    .sidebar-nav { padding: 16px 0; }
    .sidebar-nav li { list-style: none; margin: 0; }
    .sidebar-nav ul { padding: 0; margin: 0; }

    .sidebar ul li a {
      color: var(--text-secondary);
      font-size: 12px;
      font-family: var(--font-mono);
      padding: 5px 20px;
      border-left: 2px solid transparent;
      transition: all 0.15s ease;
      display: block;
      text-decoration: none;
      letter-spacing: 0.3px;
    }
    .sidebar ul li a:hover {
      color: var(--accent-green);
      background: var(--accent-green-dim);
      border-left-color: var(--accent-green);
    }
    .sidebar ul li a.active {
      color: var(--accent-green);
      border-left-color: var(--accent-green);
      background: var(--accent-green-dim);
    }

    /* Sidebar section headers */
    .sidebar-nav > ul > li > strong {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--text-muted);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 2px;
      padding: 14px 20px 4px;
      font-weight: 600;
    }
    .sidebar-nav > ul > li > strong::after {
      content: attr(data-count);
      font-size: 9px;
      background: var(--bg-elevated);
      color: var(--text-muted);
      padding: 1px 6px;
      border-radius: 3px;
      letter-spacing: 0;
    }
    .sidebar-nav > ul > li > strong ~ ul li a {
      padding-left: 32px;
    }

    /* Sidebar app name */
    .app-name {
      border-bottom: 1px solid var(--border-color);
      padding: 18px 20px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .app-name .dot {
      width: 8px; height: 8px;
      background: var(--accent-green);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent-green);
      animation: pulse 2s ease-in-out infinite;
      flex-shrink: 0;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .app-name a {
      color: var(--accent-green);
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 3px;
      text-decoration: none;
      text-shadow: 0 0 20px rgba(0, 255, 65, 0.25);
    }
    .app-name .version {
      margin-left: auto;
      font-size: 9px;
      color: var(--text-muted);
      letter-spacing: 1px;
    }

    /* Sidebar search */
    .sidebar-search {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
    }
    .sidebar-search input {
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-size: 12px;
      padding: 8px 12px;
      width: 100%;
      border-radius: 4px;
      outline: none;
      transition: border-color 0.15s;
    }
    .sidebar-search input:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 8px rgba(0, 163, 255, 0.2);
    }
    .sidebar-search input::placeholder { color: var(--text-muted); }

    /* Search results */
    .search {
      background: var(--bg-primary);
      border-bottom: 1px solid var(--border-color);
    }
    .search .search-keyword { color: var(--accent-amber); font-style: normal; }
    .search li a { color: var(--text-secondary); }
    .search li a:hover {
      color: var(--accent-green);
      background: var(--accent-green-dim);
    }
    .search .matching-post {
      border-bottom: 1px solid var(--border-color);
      padding: 8px 16px;
    }
    .search .matching-post h2 {
      font-size: 13px;
      color: var(--accent-blue);
      margin: 0 0 4px;
    }

    /* === MAIN CONTENT === */
    .content {
      margin-left: var(--sidebar-width);
      padding: 0;
      background: var(--bg-primary);
    }

    /* === HEADINGS (existing docsify pages) === */
    .markdown-section {
      padding: 40px 60px;
      max-width: 920px;
    }
    .markdown-section h1 {
      color: var(--accent-green);
      font-size: 24px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 3px;
      text-shadow: 0 0 20px rgba(0, 255, 65, 0.2);
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
      margin: 0 0 24px;
    }
    .markdown-section h2 {
      color: var(--accent-blue);
      font-size: 16px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin: 28px 0 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-color);
    }
    .markdown-section h3 {
      color: var(--accent-amber);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 1px;
      margin: 24px 0 10px;
    }
    .markdown-section h4 {
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 600;
      margin: 18px 0 8px;
    }
    .markdown-section p {
      color: var(--text-secondary);
      margin: 12px 0;
    }
    .markdown-section a { color: var(--accent-blue); }
    .markdown-section a:hover { color: var(--accent-green); }
    .markdown-section ul, .markdown-section ol {
      color: var(--text-secondary);
      padding-left: 20px;
    }
    .markdown-section li { margin: 4px 0; }
    .markdown-section blockquote {
      border-left: 3px solid var(--accent-blue);
      background: var(--bg-tertiary);
      padding: 12px 16px;
      margin: 16px 0;
      color: var(--text-secondary);
    }
    .markdown-section code {
      background: var(--bg-elevated);
      color: var(--accent-amber);
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 12px;
    }
    .markdown-section pre {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-top: 2px solid var(--accent-green);
      border-radius: 4px;
      padding: 14px 18px;
      overflow-x: auto;
    }
    .markdown-section pre code {
      background: transparent;
      color: var(--text-primary);
      padding: 0;
    }
    .markdown-section table {
      border-collapse: collapse;
      width: 100%;
      margin: 16px 0;
      font-size: 12px;
    }
    .markdown-section table th {
      background: var(--bg-elevated);
      color: var(--accent-green);
      padding: 8px 12px;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 1px;
    }
    .markdown-section table td {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border-color);
      color: var(--text-secondary);
    }
    .markdown-section table tr:hover td {
      background: var(--bg-tertiary);
    }

    /* ============================================================
       DASHBOARD HOME PAGE — Bloomberg-terminal style
       Only renders on '/' route via custom docsify plugin below
       ============================================================ */

    .dashboard {
      padding: 32px 48px;
      max-width: 1400px;
    }

    /* TOP BAR */
    .dash-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 32px;
    }
    .dash-breadcrumb {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: var(--text-muted);
    }
    .dash-breadcrumb a { color: var(--text-secondary); }
    .dash-breadcrumb a:hover { color: var(--accent-green); }
    .dash-actions { display: flex; gap: 8px; }
    .dash-btn {
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 6px 14px;
      border-radius: 4px;
      font-family: inherit;
      font-size: 11px;
      text-decoration: none;
      transition: all 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .dash-btn:hover { border-color: var(--accent-green); color: var(--accent-green); }
    .dash-btn.primary {
      background: var(--accent-green-dim);
      border-color: var(--accent-green);
      color: var(--accent-green);
    }
    .dash-btn.primary:hover {
      background: var(--accent-green);
      color: var(--bg-primary);
    }

    /* HERO */
    .dash-hero { margin-bottom: 32px; }
    .dash-hero-meta {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 10px;
      font-size: 11px;
      color: var(--text-muted);
      flex-wrap: wrap;
    }
    .dash-hero-meta .live {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--accent-green);
      font-weight: 500;
    }
    .dash-hero-meta .live .pulse {
      width: 6px; height: 6px;
      background: var(--accent-green);
      border-radius: 50%;
      box-shadow: 0 0 6px var(--accent-green);
      animation: pulse 2s ease-in-out infinite;
    }
    .dash-hero-meta .sep { color: var(--border-light); }

    .dash-hero h1 {
      font-size: 32px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.5px;
      margin: 0 0 10px;
      text-shadow: 0 0 30px rgba(0, 255, 65, 0.1);
    }
    .dash-hero h1 .accent { color: var(--accent-green); }
    .dash-hero .subtitle {
      color: var(--text-secondary);
      font-size: 13px;
      max-width: 760px;
      line-height: 1.7;
    }

    /* STATS GRID */
    .dash-stats {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 12px;
      margin-bottom: 40px;
    }
    .dash-stat {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 14px 16px;
      position: relative;
      overflow: hidden;
      transition: border-color 0.15s, transform 0.15s;
    }
    .dash-stat:hover {
      border-color: var(--border-light);
      transform: translateY(-1px);
    }
    .dash-stat::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 3px;
      height: 100%;
      background: var(--accent-green);
    }
    .dash-stat.blue::before { background: var(--accent-blue); }
    .dash-stat.amber::before { background: var(--accent-amber); }
    .dash-stat.purple::before { background: var(--accent-purple); }
    .dash-stat .label {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 600;
    }
    .dash-stat .value {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1;
      margin-bottom: 5px;
      font-variant-numeric: tabular-nums;
    }
    .dash-stat .value.green { color: var(--accent-green); }
    .dash-stat .value.blue { color: var(--accent-blue); }
    .dash-stat .value.amber { color: var(--accent-amber); }
    .dash-stat .value.purple { color: var(--accent-purple); }
    .dash-stat .delta {
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 0.3px;
    }
    .dash-stat .delta.up { color: var(--accent-green); }
    .dash-stat .delta.down { color: var(--accent-amber); }

    /* SECTION HEADER */
    .dash-section-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-color);
    }
    .dash-section-head h2 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 2.5px;
      color: var(--text-secondary);
      font-weight: 700;
      margin: 0;
    }
    .dash-section-head .meta {
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

    /* CATEGORIES GRID */
    .dash-categories {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-bottom: 40px;
    }
    .dash-cat-tile {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 18px;
      transition: all 0.2s;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      text-decoration: none;
      display: block;
    }
    .dash-cat-tile:hover {
      border-color: var(--border-light);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
    }
    .dash-cat-tile .cat-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .dash-cat-tile .icon-wrap {
      width: 38px; height: 38px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .dash-cat-tile.green .icon-wrap { background: var(--accent-green-dim); color: var(--accent-green); }
    .dash-cat-tile.blue .icon-wrap { background: var(--accent-blue-dim); color: var(--accent-blue); }
    .dash-cat-tile.amber .icon-wrap { background: var(--accent-amber-dim); color: var(--accent-amber); }
    .dash-cat-tile.purple .icon-wrap { background: var(--accent-purple-dim); color: var(--accent-purple); }
    .dash-cat-tile.red .icon-wrap { background: var(--accent-red-dim); color: var(--accent-red); }
    .dash-cat-tile.slate .icon-wrap { background: rgba(98, 114, 164, 0.15); color: var(--text-muted); }

    .dash-cat-tile .count {
      font-size: 10px;
      color: var(--text-muted);
      text-align: right;
      letter-spacing: 0.3px;
    }
    .dash-cat-tile .count strong {
      display: block;
      color: var(--text-primary);
      font-size: 18px;
      line-height: 1;
      margin-bottom: 2px;
      font-weight: 700;
    }
    .dash-cat-tile h3 {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      margin: 0 0 4px;
      letter-spacing: 0.3px;
    }
    .dash-cat-tile .desc {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 14px;
      line-height: 1.5;
    }
    .dash-cat-tile .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      color: var(--text-muted);
      padding-top: 12px;
      border-top: 1px solid var(--border-color);
      letter-spacing: 0.3px;
    }
    .dash-cat-tile .footer .last-update {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .dash-cat-tile .footer .last-update .dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--accent-green);
      box-shadow: 0 0 4px var(--accent-green);
    }
    .dash-cat-tile.amber .footer .last-update .dot { background: var(--accent-amber); box-shadow: 0 0 4px var(--accent-amber); }
    .dash-cat-tile .arrow {
      font-size: 14px;
      transition: transform 0.15s;
    }
    .dash-cat-tile:hover .arrow { transform: translateX(3px); color: var(--accent-green); }

    /* RECENT ENTRIES */
    .dash-entries {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 32px;
    }
    .dash-entry {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 12px 18px;
      display: grid;
      grid-template-columns: 80px 1fr auto auto auto;
      gap: 18px;
      align-items: center;
      transition: all 0.15s;
      cursor: pointer;
      text-decoration: none;
    }
    .dash-entry:hover {
      border-color: var(--border-light);
      background: var(--bg-tertiary);
    }
    .dash-entry .date {
      font-size: 10px;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.3px;
    }
    .dash-entry .info { min-width: 0; }
    .dash-entry .info h4 {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
      margin: 0 0 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .dash-entry .info .author {
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 0.3px;
    }
    .dash-entry .cat-tag {
      font-size: 10px;
      padding: 3px 9px;
      border-radius: 3px;
      border: 1px solid;
      font-weight: 500;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }
    .dash-entry .cat-tag.green { color: var(--accent-green); border-color: var(--accent-green); background: var(--accent-green-dim); }
    .dash-entry .cat-tag.blue { color: var(--accent-blue); border-color: var(--accent-blue); background: var(--accent-blue-dim); }
    .dash-entry .cat-tag.amber { color: var(--accent-amber); border-color: var(--accent-amber); background: var(--accent-amber-dim); }
    .dash-entry .cat-tag.purple { color: var(--accent-purple); border-color: var(--accent-purple); background: var(--accent-purple-dim); }
    .dash-entry .cat-tag.red { color: var(--accent-red); border-color: var(--accent-red); background: var(--accent-red-dim); }
    .dash-entry .cat-tag.slate { color: var(--text-muted); border-color: var(--border-light); background: transparent; }

    .dash-entry .rating {
      display: flex;
      gap: 1px;
      font-size: 10px;
    }
    .dash-entry .rating .star { color: var(--border-light); }
    .dash-entry .rating .star.on { color: var(--accent-amber); }

    .dash-entry .arrow {
      color: var(--text-muted);
      font-size: 14px;
      transition: all 0.15s;
    }
    .dash-entry:hover .arrow { color: var(--accent-green); transform: translateX(2px); }

    /* FOOTER */
    .dash-footer {
      margin-top: 40px;
      padding-top: 24px;
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      color: var(--text-muted);
    }
    .dash-footer .links { display: flex; gap: 18px; }
    .dash-footer .links a { color: var(--text-secondary); letter-spacing: 0.3px; }
    .dash-footer .version { font-variant-numeric: tabular-nums; letter-spacing: 0.3px; }

    /* === RESPONSIVE === */
    @media (max-width: 1200px) {
      .dash-stats { grid-template-columns: repeat(3, 1fr); }
      .dash-categories { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 768px) {
      .sidebar { position: relative; width: 100%; height: auto; }
      .content { margin-left: 0; }
      .dashboard { padding: 20px; }
      .dash-stats { grid-template-columns: repeat(2, 1fr); }
      .dash-categories { grid-template-columns: 1fr; }
      .dash-entry {
        grid-template-columns: 1fr;
        gap: 6px;
      }
      .dash-entry .date { font-weight: 600; color: var(--text-secondary); }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
