<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ArchonOS Improvement Wiki</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Living wiki of AI agent improvement videos — curated for ArchonOS.">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧠</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    /* ============================================================
       ARCHONOS IMPROVEMENT WIKI — CYBERPUNK THEME
       Colors derived from Alfred's dashboard screenshot
       Background: #0d1117  |  Green: #00ff41  |  Blue: #00a3ff
       Amber: #ffb86c       |  Red: #ff5555     |  Slate: #6272a4
       ============================================================ */

    :root {
      --bg-primary: #0d1117;
      --bg-secondary: #161b22;
      --bg-tertiary: #1c2333;
      --border-color: #1e2a3a;
      --border-light: #2d3a4a;
      --text-primary: #c9d1d9;
      --text-secondary: #8b949e;
      --text-muted: #6272a4;
      --accent-green: #00ff41;
      --accent-green-dim: rgba(0, 255, 65, 0.12);
      --accent-blue: #00a3ff;
      --accent-blue-dim: rgba(0, 163, 255, 0.12);
      --accent-amber: #ffb86c;
      --accent-amber-dim: rgba(255, 184, 108, 0.12);
      --accent-red: #ff5555;
      --accent-red-dim: rgba(255, 85, 85, 0.12);
      --font-mono: 'JetBrains Mono', monospace;
      --sidebar-width: 300px;
    }

    /* === BASE === */
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-size: 14px;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }

    /* === SIDEBAR === */
    .sidebar {
      background: var(--bg-secondary);
      border-right: 1px solid var(--border-color);
      width: var(--sidebar-width);
      overflow-y: auto;
    }

    .sidebar-nav {
      padding: 16px 0;
    }

    .sidebar-nav li {
      list-style: none;
      margin: 0;
    }

    .sidebar-nav ul {
      padding: 0;
      margin: 0;
    }

    .sidebar ul li a {
      color: var(--text-secondary);
      font-size: 12px;
      font-family: var(--font-mono);
      padding: 4px 20px;
      border-left: 2px solid transparent;
      transition: all 0.2s ease;
      display: block;
      text-decoration: none;
      letter-spacing: 0.5px;
    }

    .sidebar ul li a:hover {
      color: var(--accent-green);
      background: var(--accent-green-dim);
      border-left-color: var(--accent-green);
    }

    .sidebar ul li a.active {
      color: var(--accent-green);
      border-left-color: var(--accent-green);
      background: var(--accent-green-dim);
    }

    /* Sidebar section headers (strong tags in sidebar) */
    .sidebar-nav > ul > li > strong {
      display: block;
      color: var(--accent-blue);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 3px;
      padding: 12px 20px 4px;
      font-weight: 600;
    }

    .sidebar-nav > ul > li > strong ~ ul li a {
      padding-left: 32px;
    }

    /* Sidebar app name */
    .app-name {
      border-bottom: 1px solid var(--border-color);
      padding: 16px 20px;
      text-align: left;
    }

    .app-name a {
      color: var(--accent-green);
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 4px;
      text-decoration: none;
      text-shadow: 0 0 20px rgba(0, 255, 65, 0.25);
    }

    .app-name a:hover {
      color: var(--accent-green);
    }

    /* Sidebar search box */
    .sidebar-search {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
    }

    .sidebar-search input {
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-size: 12px;
      padding: 8px 12px;
      width: 100%;
      border-radius: 4px;
      outline: none;
      transition: border-color 0.2s;
    }

    .sidebar-search input:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 8px rgba(0, 163, 255, 0.2);
    }

    .sidebar-search input::placeholder {
      color: var(--text-muted);
    }

    /* Search results in sidebar */
    .search {
      background: var(--bg-primary);
      border-bottom: 1px solid var(--border-color);
    }

    .search .search-keyword {
      color: var(--accent-amber);
      font-style: normal;
    }

    .search li a {
      color: var(--text-secondary);
    }

    .search li a:hover {
      color: var(--accent-green);
      background: var(--accent-green-dim);
    }

    .search .matching-post {
      border-bottom: 1px solid var(--border-color);
      padding: 8px 16px;
    }

    .search .matching-post h2 {
      font-size: 13px;
      color: var(--accent-blue);
      margin: 0 0 4px;
    }

    /* === MAIN CONTENT === */
    .content {
      margin-left: var(--sidebar-width);
      max-width: 900px;
      padding: 40px 60px;
      background: var(--bg-primary);
    }

    /* === HEADINGS === */
    .markdown-section h1 {
      color: var(--accent-green);
      font-size: 24px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 4px;
      text-shadow: 0 0 20px rgba(0, 255, 65, 0.2);
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
      margin: 32px 0 16px;
    }

    .markdown-section h2 {
      color: var(--accent-blue);
      font-size: 18px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 3px;
      margin: 28px 0 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-color);
    }

    .markdown-section h3 {
      color: var(--accent-amber);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 1px;
      margin: 24px 0 10px;
    }

    .markdown-section h4 {
      color: var(--text-primary);
      font-size: 14px;
      font-weight: 600;
      margin: 20px 0 8px;
    }

    /* === LINKS === */
    .markdown-section a {
      color: var(--accent-blue);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: all 0.2s;
    }

    .markdown-section a:hover {
      color: var(--accent-green);
      border-bottom-color: var(--accent-green);
    }

    /* === PARAGRAPHS === */
    .markdown-section p {
      color: var(--text-primary);
      line-height: 1.8;
      margin: 0 0 14px;
    }

    /* === LISTS === */
    .markdown-section ul,
    .markdown-section ol {
      padding-left: 24px;
      margin: 10px 0 16px;
    }

    .markdown-section li {
      color: var(--text-primary);
      margin: 4px 0;
      line-height: 1.7;
    }

    .markdown-section li::marker {
      color: var(--accent-blue);
    }

    /* === CODE BLOCKS === */
    .markdown-section pre {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 16px 20px;
      overflow-x: auto;
      margin: 16px 0;
      position: relative;
    }

    .markdown-section code {
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 1.6;
      color: var(--accent-green);
    }

    .markdown-section pre code {
      color: var(--text-primary);
      background: none;
    }

    /* Inline code */
    .markdown-section p code,
    .markdown-section li code {
      background: var(--bg-tertiary);
      color: var(--accent-amber);
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 12px;
      border: 1px solid var(--border-color);
    }

    /* === BLOCKQUOTES === */
    .markdown-section blockquote {
      border-left: 3px solid var(--accent-blue);
      background: var(--bg-secondary);
      margin: 16px 0;
      padding: 12px 20px;
      border-radius: 0 6px 6px 0;
    }

    .markdown-section blockquote p {
      color: var(--text-secondary);
      margin: 0;
      font-size: 13px;
    }

    /* === TABLES === */
    .markdown-section table {
      width: 100%;
      border-collapse: collapse;
      margin: 16px 0;
      font-size: 13px;
    }

    .markdown-section th {
      background: var(--bg-secondary);
      color: var(--accent-blue);
      padding: 10px 14px;
      text-align: left;
      border: 1px solid var(--border-color);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 11px;
    }

    .markdown-section td {
      padding: 10px 14px;
      border: 1px solid var(--border-color);
      color: var(--text-primary);
    }

    .markdown-section tr:hover td {
      background: var(--bg-tertiary);
    }

    /* === HORIZONTAL RULES === */
    .markdown-section hr {
      border: none;
      border-top: 1px solid var(--border-color);
      margin: 24px 0;
    }

    /* === TASKLIST CHECKBOXES === */
    .markdown-section input[type="checkbox"] {
      accent-color: var(--accent-green);
      margin-right: 6px;
    }

    /* === STRONG / EMPHASIS === */
    .markdown-section strong {
      color: var(--accent-green);
      font-weight: 600;
    }

    .markdown-section em {
      color: var(--accent-amber);
    }

    /* === IMAGES === */
    .markdown-section img {
      max-width: 100%;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      margin: 16px 0;
    }

    /* === SCROLLBAR === */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg-primary);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--border-light);
    }

    /* === COVER PAGE (if used) === */
    section.cover {
      background: var(--bg-primary) !important;
    }

    section.cover h1 {
      color: var(--accent-green) !important;
      text-shadow: 0 0 30px rgba(0, 255, 65, 0.3) !important;
    }

    /* === RESPONSIVE === */
    @media (max-width: 768px) {
      .sidebar {
        width: 260px;
      }
      .content {
        margin-left: 0;
        padding: 20px;
      }
      .sidebar-toggle {
        background: var(--bg-secondary);
        border: 1px solid var(--border-color);
      }
      .sidebar-toggle .sidebar-toggle-button span {
        background: var(--accent-green);
      }
    }

    /* === PROGRESS BAR (page load) === */
    .progress {
      background: linear-gradient(90deg, var(--accent-green), var(--accent-blue), var(--accent-amber));
      height: 2px;
    }

    /* === TOGGLE BUTTON === */
    .sidebar-toggle {
      background: var(--bg-secondary);
    }

    /* === FOOTER AREA === */
    .content p:last-child {
      color: var(--text-muted);
      font-size: 12px;
      text-align: center;
      border-top: 1px solid var(--border-color);
      padding-top: 16px;
      margin-top: 32px;
    }

    /* === TAG STYLING IN CONTENT === */
    .markdown-section .tag {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      margin: 2px 4px 2px 0;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: '▣ ARCHONOS',
      nameLink: '/',
      repo: 'https://github.com/alfredaranas/archonos-improvement-wiki',
      loadSidebar: true,
      maxLevel: 3,
      subMaxLevel: 2,
      auto2top: true,
      search: 'auto',
      mergeNavbar: false,
      formatUpdated: '{YYYY}-{MM}-{DD}',
      plugins: [
        function(hook, vm) {
          hook.afterEach(function(html) {
            return html;
          });
          hook.doneEach(function() {
            // Add glow effect to first h1 on each page
            const h1 = document.querySelector('.markdown-section h1');
            if (h1) {
              h1.style.textShadow = '0 0 20px rgba(0,255,65,0.2)';
            }
            // Style code blocks: add a top bar
            document.querySelectorAll('.markdown-section pre').forEach(function(pre) {
              pre.style.borderTop = '2px solid var(--accent-green)';
            });
            // Style blockquotes with left accent
            document.querySelectorAll('.markdown-section blockquote').forEach(function(bq) {
              bq.style.borderLeftColor = 'var(--accent-blue)';
            });
          });
        }
      ]
    };
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-sql.min.js"></script>
</body>
</html>
